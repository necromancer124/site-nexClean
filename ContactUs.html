<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/ContactUs.css">
    <title>Document</title>
</head>
<body>
    <div class="card">
        <img
            src="images/nexclean_with_borders.png"
            alt="Profile image"
            class="profile-img"
        >
        <p class="quote">Seed. Picked. Check out.</p>
        <form action="https://wa.me/972549922316" target="_blank" class="contact-form">
            <h1>Contact Us</h1>
            <p>Fill in the details in the box, and click the button to send a message on WhatsApp.</p>
            <h3 style="align-self: flex-start;">Message on WhatsApp</h3>
            <textarea name="text" id="message" class="message" placeholder="Enter your message..." style="width:85%; resize: vertical; max-height: 200px;"></textarea>
            <button class="btn-whatsapp">Send Message on WhatsApp</button>
        </form>
   

    </div>
</body>
</html>
